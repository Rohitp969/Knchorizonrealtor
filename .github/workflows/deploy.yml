name: KNC Horizon Realtor — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================
  # FRONTEND CI
  # =========================
  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build


  # =========================
  # BACKEND CI
  # =========================
  backend:
    name: Backend — Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck


  # =========================
  # DEPLOY TO VPS
  # =========================
  deploy:
    name: Deploy to KNC VPS
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    # Deploy only after a successful push to main.
    # Pull requests will NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/knc_deploy

          chmod 600 ~/.ssh/knc_deploy

          ssh-keyscan -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts


      - name: Deploy KNC application
        run: |
          ssh \
            -i ~/.ssh/knc_deploy \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -e

          echo "================================="
          echo "Starting KNC deployment"
          echo "================================="

          cd /var/www/knchorizon

          echo "Pulling latest code..."
          git pull origin main

          echo "================================="
          echo "Building frontend"
          echo "================================="

          cd /var/www/knchorizon/frontend

          npm ci
          npm run build

          echo "================================="
          echo "Updating backend"
          echo "================================="

          cd /var/www/knchorizon/backend

          npm ci

          echo "================================="
          echo "Restarting KNC backend"
          echo "================================="

          pm2 restart KNC-backend

          pm2 save

          echo "================================="
          echo "KNC deployment completed"
          echo "================================="

          EOF